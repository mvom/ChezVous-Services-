server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy: avoids browser calls directly to :8000
    location /api/v1/ {
        proxy_pass http://api:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: toute URL inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optimisation: assets buildés sont versionnés, cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Désactive le cache sur index.html pour garantir une mise à jour immédiate
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
