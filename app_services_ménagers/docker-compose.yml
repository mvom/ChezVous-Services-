services:
  db:
    image: postgres:16-alpine
    container_name: menage_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: services_menagers
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema_postgresql_initial.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d services_menagers"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menage_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-/app/logs/app.log}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5242880}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      ENABLE_REQUEST_LOGGING: ${ENABLE_REQUEST_LOGGING:-true}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_WORKERS: ${API_WORKERS:-2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/services_menagers
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      MAIL_BACKEND: ${MAIL_BACKEND:-mailhog}
      MAIL_FROM: ${MAIL_FROM:-no-reply@chezvous.local}
      MAILHOG_HOST: ${MAILHOG_HOST:-mailhog}
      MAILHOG_PORT: ${MAILHOG_PORT:-1025}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: menage_frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    depends_on:
      api:
        condition: service_healthy

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menage_tests
    command: sh -c "pip install --no-cache-dir -r requirements-test.txt && pytest -q"
    env_file:
      - .env
    environment:
      APP_ENV: test
      APP_DEBUG: false
      AUTO_MIGRATE: false
      LOG_LEVEL: WARNING
      LOG_JSON: false
      LOG_TO_FILE: false
      ENABLE_REQUEST_LOGGING: false
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-3e159fb65a9948039f1239cd58ea1595}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      MAIL_BACKEND: disabled

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: menage_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7-alpine
    container_name: menage_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    profiles:
      - async

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menage_worker
    restart: unless-stopped
    command: sh -c "celery -A app.tasks.celery_app.celery_app worker --loglevel=${LOG_LEVEL:-INFO}"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      AUTO_MIGRATE: false
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-/app/logs/worker.log}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5242880}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/services_menagers
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - async

volumes:
  postgres_data:
